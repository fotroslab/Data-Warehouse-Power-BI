<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/>
  </marker>
  <style>
  .box { fill:#ffffff; stroke:#c9d1db; stroke-width:1.5; }
  .box-fact { fill:#fdf3f3; stroke:#d64541; stroke-width:2; }
  .box-reject { fill:#fff8f1; stroke:#d9a86a; stroke-width:1.5; }
  .hdr { fill:#232b36; }
  .hdr-fact { fill:#d64541; }
  .hdr-reject { fill:#8a5a24; }
  .t { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:15px; font-weight:700; fill:#f6f7f8; direction:rtl; }
  .t-fact { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:15px; font-weight:700; fill:#ffffff; direction:rtl; }
  .pk { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:12.5px; font-weight:700; fill:#232b36; direction:rtl; }
  .col { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:12.5px; fill:#3a4553; direction:rtl; }
  .fk { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:12.5px; fill:#a3352f; direction:rtl; }
  .note { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:12px; fill:#8a5a24; direction:rtl; }
  .edge { stroke:#8a94a3; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
  .elabel { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:12px; fill:#5b6674; direction:ltr; }
  .title { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:23px; font-weight:800; fill:#232b36; direction:rtl; }
  .sub { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:12.5px; fill:#6b7480; direction:rtl; }
  .foot { font-family:Vazirmatn, Vazirmatn FD, Tahoma, sans-serif; font-size:11.5px; fill:#7b8490; direction:rtl; }
</style>
</defs>
<rect width="1200" height="790" fill="#f6f7f8"/>
<text class="title" x="1150" y="42" text-anchor="start">مدل استاراسکیما — انبار دادهٔ پروژهٔ ۵</text>
<text class="sub" x="1150" y="66" text-anchor="start">SQL Server · تقویم شمسی · واحد ریال · دادهٔ نمونه (seed=۱۴۰۳۰۵۰۵ · نمونه)</text>
<g id="dim_date">
